# Idiomas del README de MatrixFS y traducción automática.
#
# IMPORTANTE: GitHub NO ofrece una función nativa de traducción de READMEs.
# La traducción la realiza el workflow .github/workflows/translate-readme.yml,
# que lee este archivo como ÚNICA fuente de verdad en cada push.
#
# Reglas:
#   - `default:` es el idioma ORIGINAL del README.md de la raíz (fuente).
#   - `languages:` lista, EN ORDEN DE PRIORIDAD, todos los idiomas del selector.
#   - Los códigos usan la norma IETF BCP 47 (subtags ISO 639-1 + región).
#   - Cada idioma distinto de `default` se traduce a README.<código>.md.
#
# Idioma predeterminado del proyecto: español (es).

default: es

languages:
  - es        # Español — idioma principal y predeterminado del proyecto
  - en        # Inglés — máxima cobertura en ecosistemas embebidos / IoT
  - zh-CN     # Chino simplificado — gran base de usuarios ESP32 / Arduino
  - de        # Alemán — industria de automoción e infraestructura crítica
  - ja        # Japonés — equipamiento médico y robótica
  - fr        # Francés — sector industrial europeo
  - pt-BR     # Portugués (Brasil) — comunidad maker e IoT en América
  - ru        # Ruso — comunidad de sistemas empotrados
  - ko        # Coreano — electrónica de consumo e industrial
  - it        # Italiano — automatización y manufactura

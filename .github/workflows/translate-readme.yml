# Traducción automática del README.
#
# El README base se redacta en inglés en README.md (fuente). Este workflow genera
# README.<código>.md para el resto de idiomas (español, chino simplificado, alemán,
# japonés, francés, portugués de Brasil, ruso, coreano e italiano). Los idiomas se
# leen de .github/languages.yaml (única fuente de verdad).
#
# GitHub NO traduce READMEs de forma nativa: la traducción la hace este workflow.
#
# Configuración previa (una sola vez) en
# GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret:
#   - ACTION_BOT      : PAT (classic) con scopes `repo` y `workflow`. OBLIGATORIO.
#   - OPENAI_API_KEY  : opcional. Traducción de mayor calidad (gpt-4o).
#   - ZHIPUAI_API_KEY : opcional. Alternativa gratuita (glm-4-flash).
#   Si no se define ninguna clave de API se usa el backend gratuito g4f.

name: Translate README

on:
  push:
    branches: ['**']
    paths:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    # Evita bucles: no re-ejecutar sobre los commits generados por el propio bot.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == null ||
      !contains(github.event.head_commit.message, 'Auto-translate README')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ACTION_BOT }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
        run: |
          python -m pip install --quiet --upgrade pip pyyaml
          if [ -n "$OPENAI_API_KEY" ]; then python -m pip install --quiet openai; fi
          if [ -n "$ZHIPUAI_API_KEY" ]; then python -m pip install --quiet zhipuai; fi
          if [ -z "$OPENAI_API_KEY$ZHIPUAI_API_KEY" ]; then python -m pip install --quiet g4f; fi

      - name: Generar traducciones
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
        run: python .github/scripts/translate_readme.py

      - name: Commit de las traducciones
        run: |
          git config user.name  "Continuous Integration"
          git config user.email "username@users.noreply.github.com"
          git add -- 'README.*.md'
          git diff --staged --quiet || {
            git commit -m "Auto-translate README"
            git push
          }

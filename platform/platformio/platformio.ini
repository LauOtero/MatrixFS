; platformio.ini — proyecto de ejemplo de MatrixFS Ultra (ESP32, Arduino).
; Licencia: Apache-2.0.
;
; Este fichero es un EJEMPLO. Copia tu sketch en src/ y ajusta rutas si mueves
; el repositorio. El núcleo MatrixFS debe compilarse junto al sketch; véase el
; README.md de esta carpeta para las dos vías soportadas (lib_extra_dirs con el
; núcleo como librería local, o copiar/symlink del núcleo al proyecto).
;
; NO se usa board_build.filesystem = littlefs: MatrixFS NO es LittleFS. Aporta
; su propio layout on-flash y su propia partición, y no debe existir un sistema
; de ficheros del core inicializando/borrando ese rango.

[platformio]
; El proyecto vive en platform/platformio; ../ deja ver platform/arduino como
; librería candidata (contiene library.json). Ajusta según dónde copie el repo.
lib_extra_dirs = ../

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Particiones: define una partición de datos "matrixfs" (label) con el CSV
; propio del proyecto (colócalo junto a este platformio.ini). Véase README.md.
board_build.partitions = partitions.csv

; El envoltorio incluye "matrixfs/matrixfs.h", "mfs_embedded.h" y (en el .cpp)
; "mfs_internal.h". Estas rutas deben estar disponibles. En el layout
; recomendado el núcleo está copiado bajo lib/matrixfs-core, de modo que:
build_flags =
    -Ilib/matrixfs-core/include
    -Ilib/matrixfs-core/src
    -Ilib/matrixfs-core/platform/embedded

; Dependencias: la librería MatrixFS se descubre por lib_extra_dirs (../).
; También se puede fijar por ruta local:
; lib_deps = symlink://../../   ; o file://../arduino

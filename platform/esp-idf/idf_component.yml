version: "1.0.0"
description: >-
  Integracion de MatrixFS «ATLAS», sistema de archivos embebido en C11 y
  sin heap, como componente externo de ESP-IDF. Aporta el puerto (secciones
  criticas, tiempo y WFI) y los callbacks de flash sobre esp_partition.
url: "https://github.com/LauOtero/MatrixFS-ULTRA"
repository: "https://github.com/LauOtero/MatrixFS-ULTRA"
documentation: "https://github.com/LauOtero/MatrixFS-ULTRA/tree/main/platform/esp-idf"
license: "Apache-2.0"
tags:
  - filesystem
  - storage
  - embedded

dependencies:
  idf: ">=5.0"
